name: Build a feature
description: The design is settled and needs to be built.
labels: ["type:implementation"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the player, agent or operator be able to do afterwards?
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Decision this follows
      description: Link the agreed game design or decision, or explain the existing behavior this follows. Use a Decision issue if a game choice is still unresolved.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How we will know it works
      description: A checklist someone else can verify in the normal game path.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this deliberately does not do. Write "None" if nothing.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Saves, replay and docs
      description: Does this change what gets saved or how the world is reconstructed? Which docs need updating? Technical details are welcome here when needed.
