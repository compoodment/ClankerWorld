name: Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/scripts/sync-labels.js
      - .github/workflows/labels.yml
  pull_request:
    paths:
      - .github/labels.json
      - .github/scripts/sync-labels.js
      - .github/workflows/labels.yml
  schedule:
    # Deletes retired labels again, and restores listed ones, if someone
    # re-creates or changes them by hand.
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # On a pull request, only print what would change.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - name: Show the label changes this would make
        uses: actions/github-script@v8
        with:
          script: |
            const syncLabels = require('./.github/scripts/sync-labels.js');
            await syncLabels({ github, context, core, dryRun: true });

  # Changes labels only from main's copy of labels.json, even when someone
  # starts it by hand from another branch, and one run at a time.
  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: labels-sync
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Create, rename and update labels
        uses: actions/github-script@v8
        with:
          script: |
            const syncLabels = require('./.github/scripts/sync-labels.js');
            await syncLabels({ github, context, core, dryRun: false });
