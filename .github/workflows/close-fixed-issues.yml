name: Close fixed issues

# Backup for GitHub's own closing keywords. When a pull request merges into
# main, close every issue its description says it closes that is still open.
# pull_request_target gives pull requests from forks a token that can close
# issues. It never checks out or runs pull request code; the description is
# only read as text.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues the pull request completed
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const thisRepo = `${owner}/${repo}`.toLowerCase();
            const numbers = new Set();

            // GitHub's closing keywords, one per issue: "Closes #12",
            // "fixes: #12" or "Resolves owner/repo#12". Text in comments and
            // code is ignored, as GitHub ignores it.
            const text = (pr.body || '')
              .replace(/<!--[\s\S]*?-->/g, ' ')
              .replace(/```[\s\S]*?```/g, ' ')
              .replace(/`[^`\n]*`/g, ' ');
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+(?:([\w.-]+\/[\w.-]+))?#(\d+)\b/gi;
            for (const [, otherRepo, number] of text.matchAll(keyword)) {
              if (!otherRepo || otherRepo.toLowerCase() === thisRepo) {
                numbers.add(Number(number));
              }
            }

            // Also include issues GitHub itself linked to the pull request.
            const linked = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 50) {
                      nodes { number repository { nameWithOwner } }
                    }
                  }
                }
              }`,
              { owner, repo, number: pr.number });
            for (const issue of linked.repository.pullRequest.closingIssuesReferences.nodes) {
              if (issue.repository.nameWithOwner.toLowerCase() === thisRepo) {
                numbers.add(issue.number);
              }
            }

            if (numbers.size === 0) {
              core.info('The pull request does not say it closes any issue.');
              return;
            }

            // Give GitHub's own closing a moment, so this only acts when it did not.
            await new Promise(resolve => setTimeout(resolve, 15000));

            const commit = (pr.merge_commit_sha || '').slice(0, 7);
            for (const number of [...numbers].sort((a, b) => a - b)) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
              } catch (error) {
                core.warning(`Could not read #${number}: ${error.message}`);
                continue;
              }
              if (issue.pull_request) {
                core.info(`#${number} is a pull request, not an issue.`);
                continue;
              }

              if (issue.labels.some(label => label.name === 'status:in-progress')) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: number, name: 'status:in-progress' });
              }

              if (issue.state === 'closed') {
                core.info(`#${number} is already closed.`);
                continue;
              }

              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `Closed by #${pr.number}, merged as ${commit}. The pull request says it closes this issue, but GitHub did not close it automatically.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: number, state: 'closed', state_reason: 'completed' });
              core.info(`Closed #${number}.`);
            }
