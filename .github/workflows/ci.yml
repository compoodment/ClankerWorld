name: Verify

on:
  push:
    branches: [main]
  # Every base branch, so a pull request stacked on another one's branch gets CI too.
  pull_request:

permissions:
  contents: read

# A newer push to a pull request stops its older run, so runners go to the current head.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Protect main ruleset requires verify, windows-documentation and windows-provider-storage.
# verify passes only when scope, checks and every test shard pass. A pull request that changes
# only documentation (Markdown files and docs/) runs the documentation tests and skips the rest.
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.plan.outputs.code }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Decide what this change needs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A pull request's checkout merges it into its base, so the first parent is the base.
          # --no-renames lists a file moved from code to Markdown under both names.
          if [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          node .github/scripts/ci-plan.js scope < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          node .github/scripts/ci-plan.js matrix | tee -a "$GITHUB_OUTPUT"

  checks:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the workflow scripts and the label list
        run: |
          node --test .github/scripts/*.test.js
          node -e "require('./.github/scripts/sync-labels.js').readConfig()"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - name: Verify Godot client project
        if: needs.scope.outputs.code == 'true'
        run: bash scripts/verify-godot-client.sh
      - if: needs.scope.outputs.code == 'true'
        run: dotnet format --verify-no-changes --no-restore
      - name: Verify documentation (documentation-only change)
        if: needs.scope.outputs.code != 'true'
        run: dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~DocumentationTests
      - name: Restore pinned Godot export downloads
        if: needs.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/clankerworld-godot
          key: godot-4.7.2-mono-linux-x64-export-templates-v1
      - name: Verify Windows 11 x64 Godot release export
        if: needs.scope.outputs.code == 'true'
        run: bash scripts/verify-godot-windows-export.sh
      - name: Upload Windows 11 x64 Godot release export
        if: needs.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clankerworld-windows-11-x64
          path: export/windows-x64
          if-no-files-found: error

  # The test suite split across parallel jobs; .github/scripts/ci-plan.js decides which tests
  # each job runs, and every test runs in exactly one of them.
  tests:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked test dependencies
        run: dotnet restore tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --locked-mode
      - name: Run test shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          filter="$(node .github/scripts/ci-plan.js filter "$SHARD")"
          dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore --filter "$filter" --logger "trx;LogFileName=timings.trx" --results-directory "$RUNNER_TEMP/test-results"
      # Each test's duration, for rebalancing the shards in ci-plan.js.
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results/*.trx
          retention-days: 14
          if-no-files-found: warn

  verify:
    needs: [scope, checks, tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every part of Verify to pass
        env:
          CODE: ${{ needs.scope.outputs.code }}
          SCOPE: ${{ needs.scope.result }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "scope: $SCOPE, checks: $CHECKS, tests: $TESTS, code changed: $CODE"
          test "$SCOPE" = success
          test "$CHECKS" = success
          if [ "$CODE" = true ]; then test "$TESTS" = success; else test "$TESTS" = skipped; fi

  windows-documentation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked test dependencies
        run: dotnet restore tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --locked-mode
      - name: Verify documentation with LF and CRLF checkout text
        run: dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~DocumentationTests

  # Skipped for a documentation-only pull request; GitHub counts a skipped required job as passed.
  windows-provider-storage:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked test dependencies
        run: dotnet restore tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --locked-mode
      - name: Verify native protected storage and checkpoint recovery
        env:
          CLANKERWORLD_CHECKPOINT_DIAGNOSTICS: ${{ runner.temp }}/checkpoint-evidence
        run: dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~ProviderConfigurationStoreTests|FullyQualifiedName~PairedOwnerCanConfigureHostedCognitionWithoutEchoingOrSavingTheKeyInTheWorld|FullyQualifiedName~OnlySignedOwnerCanDeleteUnusedNamedCredentialSlot|FullyQualifiedName~ManualSaveGenerationTests|FullyQualifiedName~ResumeRequiresDurableCheckpointEvenOnRetry|FullyQualifiedName~ResumeCheckpointTests|FullyQualifiedName~PrivateWorldStateFileTests|FullyQualifiedName~Deletion" --logger "trx;LogFileName=windows-storage.trx" --results-directory "${{ runner.temp }}/windows-storage-results"
      - name: Upload native storage test results and checkpoint failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-storage-evidence
          path: |
            ${{ runner.temp }}/windows-storage-results
            ${{ runner.temp }}/checkpoint-evidence
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  # Draft investigation only: remove after recording the native full-suite control for #778.
  windows-checkpoint-investigation:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CLANKERWORLD_CHECKPOINT_DIAGNOSTICS: ${{ runner.temp }}/checkpoint-investigation/failures
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Restore and build the exact native diagnostic baseline
        run: |
          dotnet restore tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Join-Path $env:RUNNER_TEMP 'checkpoint-investigation'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          git rev-parse HEAD | Set-Content (Join-Path $evidence 'commit.txt')
          dotnet --info | Set-Content (Join-Path $evidence 'dotnet-info.txt')
          [System.Environment]::OSVersion.ToString() | Set-Content (Join-Path $evidence 'windows-version.txt')
          Get-Volume | Select-Object DriveLetter, FileSystem, FileSystemLabel, HealthStatus | ConvertTo-Json | Set-Content (Join-Path $evidence 'volumes.json')
          $assemblies = @('ClankerWorld.Simulation.dll', 'ClankerWorld.Simulation.pdb', 'ClankerWorld.Viewer.dll', 'ClankerWorld.Viewer.pdb', 'ClankerWorld.Simulation.Tests.dll', 'ClankerWorld.Simulation.Tests.pdb')
          Get-ChildItem tests/ClankerWorld.Simulation.Tests/bin/Release/net10.0 -File | Where-Object { $_.Name -in $assemblies } | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content (Join-Path $evidence 'assembly-hashes-before.json')
          @'
          <RunSettings>
            <xUnit><MaxParallelThreads>4</MaxParallelThreads></xUnit>
            <DataCollectionRunSettings><DataCollectors><DataCollector friendlyName="XPlat Code Coverage"><Configuration><SingleHit>true</SingleHit></Configuration></DataCollector></DataCollectors></DataCollectionRunSettings>
          </RunSettings>
          '@ | Set-Content (Join-Path $evidence 'diagnostic.runsettings')
      - name: Run the unfiltered native Release suite with four workers and SingleHit coverage
        run: dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-build --no-restore --settings "${{ runner.temp }}/checkpoint-investigation/diagnostic.runsettings" --collect "XPlat Code Coverage" --logger "trx;LogFileName=full-windows.trx" --results-directory "${{ runner.temp }}/checkpoint-investigation/results"
      - name: Record restored assembly hashes
        if: ${{ !cancelled() }}
        run: |
          $assemblies = @('ClankerWorld.Simulation.dll', 'ClankerWorld.Simulation.pdb', 'ClankerWorld.Viewer.dll', 'ClankerWorld.Viewer.pdb', 'ClankerWorld.Simulation.Tests.dll', 'ClankerWorld.Simulation.Tests.pdb')
          Get-ChildItem tests/ClankerWorld.Simulation.Tests/bin/Release/net10.0 -File | Where-Object { $_.Name -in $assemblies } | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'checkpoint-investigation/assembly-hashes-after.json')
      - name: Upload the native investigation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-checkpoint-investigation
          path: ${{ runner.temp }}/checkpoint-investigation
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
