name: Verify

on:
  push:
    branches: [main]
  # Every base branch, so a pull request stacked on another one's branch gets CI too.
  pull_request:

permissions:
  contents: read

# A newer push to a pull request stops its older run, so runners go to the current head.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Protect main ruleset requires verify, windows-documentation and windows-provider-storage.
# verify passes only when scope, checks and every test shard pass. A pull request that changes
# only documentation (Markdown files and docs/) runs the documentation tests and skips the rest.
# One that also changes only Godot client files the test project does not compile runs the code
# checks too, but skips the test suite, which those files cannot affect. Only an explicit
# tests=false from scope skips the test suite.
jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the test timings uploaded by main's latest green run.
      actions: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
      tests: ${{ steps.plan.outputs.tests }}
      shards: ${{ steps.plan.outputs.shards }}
      filter-1: ${{ steps.split.outputs.filter_1 }}
      filter-2: ${{ steps.split.outputs.filter_2 }}
      filter-3: ${{ steps.split.outputs.filter_3 }}
      filter-4: ${{ steps.split.outputs.filter_4 }}
      filter-5: ${{ steps.split.outputs.filter_5 }}
      filter-6: ${{ steps.split.outputs.filter_6 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Decide what this change needs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A pull request's checkout merges it into its base, so the first parent is the base.
          # --no-renames lists a file moved from code to Markdown under both names.
          if [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          node .github/scripts/ci-plan.js scope < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          node .github/scripts/ci-plan.js matrix | tee -a "$GITHUB_OUTPUT"
      # Without these timings the split falls back to the fixed one in ci-plan.js.
      - name: Fetch test timings from main's latest green run
        if: steps.plan.outputs.tests != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          echo "Timings from run ${run_id}"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'test-timings-*' --dir "$RUNNER_TEMP/timings"
      - name: Split the tests between the test jobs
        id: split
        if: steps.plan.outputs.tests != 'false'
        run: node .github/scripts/ci-plan.js plan "$RUNNER_TEMP/timings" >> "$GITHUB_OUTPUT"

  checks:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the workflow scripts and the label list
        run: |
          node --test .github/scripts/*.test.js
          node -e "require('./.github/scripts/sync-labels.js').readConfig()"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      # The shared tool cache (scripts/tool-cache.sh) checks each download's pinned SHA-256.
      - name: Restore pinned Godot downloads
        if: needs.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/clankerworld/tools/downloads
          key: godot-downloads-${{ hashFiles('scripts/verify-godot-client.sh', 'scripts/verify-godot-windows-export.sh') }}
      - name: Verify Godot client project
        if: needs.scope.outputs.code == 'true'
        run: bash scripts/verify-godot-client.sh
      - if: needs.scope.outputs.code == 'true'
        run: dotnet format --verify-no-changes --no-restore
      - name: Verify documentation (the test suite is skipped)
        if: needs.scope.outputs.tests == 'false'
        run: dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~DocumentationTests
      - name: Verify Windows 11 x64 Godot release export
        if: needs.scope.outputs.code == 'true'
        run: bash scripts/verify-godot-windows-export.sh
      - name: Upload Windows 11 x64 Godot release export
        if: needs.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clankerworld-windows-11-x64
          path: export/windows-x64
          if-no-files-found: error

  # The test suite split across parallel jobs by scope's plan (.github/scripts/ci-plan.js);
  # every test runs in exactly one of them.
  tests:
    needs: scope
    if: needs.scope.outputs.tests != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked test dependencies
        run: dotnet restore tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --locked-mode
      - name: Run test shard ${{ matrix.shard }}
        env:
          FILTER: ${{ needs.scope.outputs[format('filter-{0}', matrix.shard)] }}
        run: |
          test -n "$FILTER"
          dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore --filter "$FILTER" --logger "trx;LogFileName=timings.trx" --results-directory "$RUNNER_TEMP/test-results"
      - name: Report the slowest tests
        if: ${{ !cancelled() }}
        run: node .github/scripts/ci-plan.js slow "$RUNNER_TEMP/test-results"
      # Each test's duration, which later runs use to split the tests.
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results/*.trx
          retention-days: 14
          if-no-files-found: warn

  verify:
    needs: [scope, checks, tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every part of Verify to pass
        env:
          CODE: ${{ needs.scope.outputs.code }}
          TESTS_NEEDED: ${{ needs.scope.outputs.tests }}
          SCOPE: ${{ needs.scope.result }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "scope: $SCOPE, checks: $CHECKS, tests: $TESTS, code changed: $CODE, tests needed: $TESTS_NEEDED"
          test "$SCOPE" = success
          test "$CHECKS" = success
          if [ "$TESTS_NEEDED" = false ]; then test "$TESTS" = skipped; else test "$TESTS" = success; fi

  windows-documentation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked test dependencies
        run: dotnet restore tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --locked-mode
      - name: Verify documentation with LF and CRLF checkout text
        run: dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~DocumentationTests

  # Skipped when scope skips the test suite; GitHub counts a skipped required job as passed.
  windows-provider-storage:
    needs: scope
    if: needs.scope.outputs.tests != 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked test dependencies
        run: dotnet restore tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --locked-mode
      - name: Verify native protected storage and checkpoint recovery
        env:
          CLANKERWORLD_CHECKPOINT_DIAGNOSTICS: ${{ runner.temp }}/checkpoint-evidence
        run: dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~ProviderConfigurationStoreTests|FullyQualifiedName~PairedOwnerCanConfigureHostedCognitionWithoutEchoingOrSavingTheKeyInTheWorld|FullyQualifiedName~OnlySignedOwnerCanDeleteUnusedNamedCredentialSlot|FullyQualifiedName~ManualSaveGenerationTests|FullyQualifiedName~ResumeRequiresDurableCheckpointEvenOnRetry|FullyQualifiedName~ResumeCheckpointTests|FullyQualifiedName~PrivateWorldStateFileTests|FullyQualifiedName~Deletion" --logger "trx;LogFileName=windows-storage.trx" --results-directory "${{ runner.temp }}/windows-storage-results"
      - name: Upload native storage test results and checkpoint failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-storage-evidence
          path: |
            ${{ runner.temp }}/windows-storage-results
            ${{ runner.temp }}/checkpoint-evidence
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
