name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - name: Verify Godot client project
        run: bash scripts/verify-godot-client.sh
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test --configuration Release --no-restore
      - name: Restore pinned Godot export downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/clankerworld-godot
          key: godot-4.7.2-mono-linux-x64-export-templates-v1
      - name: Verify Windows 11 x64 Godot release export
        run: bash scripts/verify-godot-windows-export.sh
      - name: Upload Windows 11 x64 Godot release export
        uses: actions/upload-artifact@v4
        with:
          name: clankerworld-windows-11-x64
          path: export/windows-x64
          if-no-files-found: error

  windows-documentation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked test dependencies
        run: dotnet restore tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --locked-mode
      - name: Verify documentation with LF and CRLF checkout text
        run: dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~DocumentationTests

  windows-provider-storage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked test dependencies
        run: dotnet restore tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --locked-mode
      - name: Verify native protected storage and checkpoint recovery
        run: dotnet test tests/ClankerWorld.Simulation.Tests/ClankerWorld.Simulation.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~ProviderConfigurationStoreTests|FullyQualifiedName~PairedOwnerCanConfigureHostedCognitionWithoutEchoingOrSavingTheKeyInTheWorld|FullyQualifiedName~OnlySignedOwnerCanDeleteUnusedNamedCredentialSlot|FullyQualifiedName~ManualSaveGenerationTests|FullyQualifiedName~ResumeRequiresDurableCheckpointEvenOnRetry|FullyQualifiedName~ResumeCheckpointTests|FullyQualifiedName~Deletion"
